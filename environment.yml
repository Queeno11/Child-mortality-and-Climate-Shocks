# Conda environment for the Child Mortality & Climate Shocks project (WSL2 / Linux).
#
# One-line install:
#     conda env create -f environment.yml
#     conda activate climate-mortality
#
# (or with the faster solver:  mamba env create -f environment.yml)
#
# This covers the PYTHON side (data prep, climate indices, geospatial, plotting).
# The JULIA regression stage (04_regressions.jl / CustomModels.jl) is handled by
# the bundled `julia` binary below + Project.toml — run setup_wsl_env.sh to do
# both in one shot, or see the note at the bottom.
name: climate-mortality
channels:
  - conda-forge
dependencies:
  - python=3.11

  # --- core scientific stack ---
  - numpy=2.2.6
  - pandas=2.3.2
  - scipy=1.16.1
  - numba=0.61.2
  - tqdm=4.67.1
  - pyarrow=21.0.0            # Arrow/Feather I/O shared with the Julia stage

  # --- geospatial / climate (conda-forge pulls GDAL/PROJ/GEOS/eccodes cleanly) ---
  - xarray=2025.8.0
  - dask=2025.7.0
  - rioxarray=0.19.0
  - geopandas=1.1.1
  - geocube=0.7.1
  - metpy
  - netcdf4=1.7.2            # read ERA5 NetCDF
  - h5netcdf=1.6.4
  - cfgrib             # read ERA5 GRIB (pulls eccodes)
  - eccodes
  - bottleneck=1.5.0         # xarray reductions

  # --- ERA5 / CDS download client (00_query_ERA5_*.py) ---
  - cdsapi

  # --- plotting ---
  - matplotlib=3.10.6
  - seaborn=0.13.2
  - plotly=6.3.0
  - folium=0.20.0

  # --- notebooks / profiling (used across the .ipynb files) ---
  - jupyterlab=4.4.6
  - ipykernel=6.30.1
  - ipython=9.5.0
  - line_profiler
  - openpyxl=3.1.5           # the .xlsx outputs

  # --- Julia binary so the whole project installs from one manager ---
  - julia

  # --- anything not reliably on conda-forge goes through pip ---
  - pip=25.2
  - pip:
      - climate-indices   # SPI/SPEI/PDSI etc. (01_compute_climate_indices.py)